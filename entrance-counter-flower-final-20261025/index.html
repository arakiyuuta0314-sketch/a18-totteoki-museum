<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>A18｜受付の花器・完成候補</title><style>*{box-sizing:border-box}body{margin:0;color:#24382e;background:#f7f4ed;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif}header{background:#294e3c;color:#fff;padding:24px 17px}header>div,main{max-width:860px;margin:auto}h1{font-size:1.48rem;margin:7px 0}h2{font-size:1.14rem;margin:6px 0 12px}p{line-height:1.7}main{padding:14px}.panel{padding:14px;background:#fff;border:1px solid #e2ded4;border-radius:14px;margin-bottom:14px}.viewer{border-radius:9px;background:#ede8dc;overflow:hidden}canvas{display:block;width:100%;max-width:546px;height:auto;margin:auto}label{display:block;font-weight:600;font-size:.94rem}input[type=range]{width:100%;accent-color:#38744e}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:14px 0}.controls>div{background:#f0f4ee;padding:12px;border-radius:10px}.checks{display:flex;gap:10px;align-items:center}.checks input{accent-color:#38744e}.minor{color:#69766c;font-size:.83rem}button{background:#2b6849;color:#fff;border:0;border-radius:8px;padding:10px 15px;font-weight:700;cursor:pointer}.duo,.trio{display:grid;gap:8px}.duo{grid-template-columns:1fr 1fr}.trio{grid-template-columns:repeat(3,minmax(0,1fr))}.duo img,.trio img{width:100%;border-radius:7px;border:1px solid #dcd5c8}.foot{font-size:.8rem;color:#69766c}a{color:#246644}@media(max-width:450px){.trio figcaption,.duo figcaption{font-size:.75rem}.panel{padding:10px}}figure{margin:0}figcaption{margin-top:4px;text-align:center;font-size:.84rem}</style></head><body>
<header><div><small>A18 とっておき美術館｜エントランス素材</small><h1>受付カウンターの花器</h1><p>原本の黄色い花と銀色の花器を取り出し、写真や館内を変えずに移動・拡大縮小できる素材にしました。</p></div></header>
<main><section class="panel"><h2>配置と大きさを確認</h2><p class="minor">原本写真・承認済みキャラクター素材と合成した画像です。花器以外は変更していません。</p><div class="viewer"><canvas id="preview" width="1092" height="966" aria-label="館内の花器プレビュー"></canvas></div>
<div class="controls"><div><label for="scale">花器の大きさ <output id="scaleOut">100%</output></label><input id="scale" type="range" min="90" max="110" value="100"></div><div><label for="shift">花器の横位置 <output id="shiftOut">標準</output></label><input id="shift" type="range" min="-5" max="0" value="0"></div><div class="checks"><input id="show" type="checkbox" checked><label for="show">花器を表示</label></div></div>
<button id="reset">標準の配置に戻す</button></section>
<section class="panel"><h2>空のカウンターとの比較</h2><div class="duo"><figure><a href="QA_photos_characters_flower_100pct.png"><img src="QA_photos_characters_flower_100pct.png" alt="花器あり"></a><figcaption>花器あり</figcaption></figure><figure><a href="QA_photos_characters_no_counter_flower.png"><img src="QA_photos_characters_no_counter_flower.png" alt="花器なし"></a><figcaption>花器なし・背景修復</figcaption></figure></div></section>
<section class="panel"><h2>サイズ変更の合成比較</h2><div class="trio"><figure><a href="QA_photos_characters_flower_090pct.png"><img src="QA_photos_characters_flower_090pct.png" alt="90%"></a><figcaption>90%</figcaption></figure><figure><a href="QA_photos_characters_flower_100pct.png"><img src="QA_photos_characters_flower_100pct.png" alt="100%"></a><figcaption>100%</figcaption></figure><figure><a href="QA_photos_characters_flower_110pct.png"><img src="QA_photos_characters_flower_110pct.png" alt="110%"></a><figcaption>110%</figcaption></figure></div>
<p class="minor">花器を消した後ろの緑色の天板は原本から修復しています。写真の窓や正式キャラクターは描き直していません。画素完全一致ではなく修復範囲外一致で検証済みです。</p>
<p><a href="QA_manifest.json">制作・透明度・比較画像のQA</a></p></section>
</main><script src="flower-preview.js"></script></body></html>
