<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A18 左右通路試作比較</title><style>body{background:#ece8df;color:#173f37;font-family:system-ui;margin:20px}button{font-size:16px;padding:10px;margin:5px;background:#fff;border:2px solid #35695b;border-radius:7px}button[aria-pressed=true]{background:#35695b;color:#fff}img{max-width:100%;image-rendering:pixelated;border:4px solid #725037;background:#fff}.wrap{max-width:546px;margin:auto}p{line-height:1.7}</style><div class="wrap"><h1>A18 エントランス 左右通路試作</h1><p>実ゲームの背景素材から作成した静的比較です。正面扉は現行素材を維持。左右の移動判定・キャラクター表示はまだ未検証です。</p><div id="buttons"><button onclick="set('current',this)" aria-pressed="true">現行</button><button onclick="set('locked',this)" aria-pressed="false">未開放</button><button onclick="set('opened',this)" aria-pressed="false">開放済み</button></div><img id="scene" src="current.png" width="546" height="483" alt="エントランス比較"><p>確認点：左右の壁の切れ目が通路に見えるか／木製仕切りが封鎖に見えるか／中央の木製扉が残っているか。</p></div><script>function set(n,b){document.getElementById('scene').src=n+'.png';document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'))}</script></html>
