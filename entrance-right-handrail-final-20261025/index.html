<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>A18｜右側手すり独立素材</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f5ef;color:#244233;font-family:system-ui,-apple-system,sans-serif}header{background:#284b39;color:white;padding:22px 16px}header>div,main{max-width:850px;margin:auto}main{padding:13px}h1{font-size:1.4rem}h2{font-size:1.13rem}.card{border:1px solid #ddd7cb;border-radius:14px;background:white;padding:14px;margin:12px 0}.viewer{background:#eae7dd}canvas{width:100%;max-width:546px;display:block;margin:auto}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:9px;margin:12px 0}label{display:flex;align-items:center;gap:6px;padding:11px;background:#eaf4ed;border-radius:8px;font-size:.94rem}input{accent-color:#2e6b49}input[type=range]{width:100%}.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}.duo img{width:100%;border-radius:8px}button{border:0;border-radius:8px;background:#2d6649;color:white;padding:10px 13px;font-weight:650}.minor{color:#6b756e;font-size:.85rem}p{line-height:1.65}a{color:#2d6749}</style></head><body><header><div><small>A18 とっておき美術館｜エントランス完成候補</small><h1>右側の手すり（O03）</h1><p>右手前の展示壁を囲う木製手すりを、写真枠とは独立した前景素材にしました。</p></div></header><main><section class="card"><h2>写真枠・手すりを別々に確認</h2><div class="viewer"><canvas id="viewer" width="1092" height="966"></canvas></div><div class="controls"><label><input id="rail" type="checkbox" checked>右側手すりを表示</label><label><input id="frame" type="checkbox" checked>右手前額縁を表示</label><label><input id="photo" type="checkbox" checked>写真登録済み</label><label>額縁サイズ <output id="size">100%</output><input type="range" min="90" max="110" id="scale" value="100"></label></div><button id="reset">元の配置に戻す</button><p class="minor">手すりを外した状態の下地は隠れていた部分の修復画像です。手すりのある状態を完成美術の基準としています。</p></section>
<section class="card"><h2>元の美術との比較</h2><div class="duo"><div><a href="QA_rail_photo.png"><img src="QA_rail_photo.png" alt="手すりあり"></a><small>手すりあり</small></div><div><a href="QA_no_rail_photo.png"><img src="QA_no_rail_photo.png" alt="手すりなし"></a><small>手すりを外した状態</small></div></div><p><a href="QA_manifest.json">原本再合成・レイヤー・透明度の検証記録</a></p></section></main><script src="rail-preview.js"></script></body></html>
