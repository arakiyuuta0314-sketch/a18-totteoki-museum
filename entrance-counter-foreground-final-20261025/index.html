<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>A18 受付カウンター前縁・完成候補</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f5ed;color:#253b30;font-family:system-ui,-apple-system,sans-serif}header{background:#244737;color:white;padding:22px 16px}header>div,main{max-width:900px;margin:auto}h1{font-size:1.4rem;margin:5px 0}h2{font-size:1.13rem;margin:4px 0 10px}main{padding:13px}.card{padding:15px;background:white;border:1px solid #e2ddd1;border-radius:14px;margin:13px 0}.viewer{background:#f2eee4;border-radius:7px}canvas{display:block;width:100%;max-width:546px;height:auto;margin:auto}p{line-height:1.65}.sm{font-size:.85rem;color:#66746a}.toggles{display:flex;flex-wrap:wrap;gap:11px;padding:14px 0}.toggles label{padding:12px;border-radius:8px;background:#ebf3e9;display:flex;gap:8px;align-items:center}.toggles input{accent-color:#306746}.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}.compare img{width:100%;border-radius:8px}a{color:#246743}</style></head><body><header><div><small>とっておき美術館｜エントランス完成美術候補</small><h1>受付カウンターの前縁</h1><p>カウンターの木製縁と前面を分離し、キャラクターの奥行き表示に対応しました。</p></div></header><main><section class="card"><h2>カウンターの奥・手前を切り替え</h2><p class="sm">原本の背景・写真・正式キャラクターを使い、実際の透過PNGレイヤーで描いています。</p><div class="viewer"><canvas id="viewer" width="1092" height="966"></canvas></div><div class="toggles"><label><input id="behind" type="radio" name="depth" checked>カウンターの奥</label><label><input id="front" type="radio" name="depth">カウンターの手前</label></div></section><section class="card"><h2>比較画像</h2><div class="compare"><div><a href="QA_actor_behind_counter.png"><img src="QA_actor_behind_counter.png" alt="奥にいる"/></a><small>奥側</small></div><div><a href="QA_actor_in_front_counter.png"><img src="QA_actor_in_front_counter.png" alt="手前にいる"/></a><small>手前側</small></div></div><p class="sm">元画像へ戻した場合は546×483の全画素で一致。実際にカウンター内を移動できるかどうかは、ゲームへの組み込み段階で当たり判定と照合します。</p><p><a href="QA_manifest.json">仕様・PNG透過・合成QAを確認</a></p></section></main><script src="render-counter.js"></script></body></html>
