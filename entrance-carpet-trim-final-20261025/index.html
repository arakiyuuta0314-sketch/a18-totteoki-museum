<!doctype html><html lang="ja"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><link rel="icon" href="data:,"/><title>A18 エントランス絨毯・金の縁取り</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f3ea;color:#26392f;font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN',sans-serif}header{background:#284837;color:#fff;padding:22px 16px}header>div,main{max-width:950px;margin:auto}main{padding:14px}h1{font-size:1.4rem;margin:6px 0}h2{font-size:1.14rem;margin:8px 0}p{line-height:1.6}.card{background:#fff;border-radius:13px;border:1px solid #e3dfd4;margin:12px 0;padding:14px}.viewer{background:#ede8dc;border-radius:8px;overflow:hidden}canvas{display:block;width:100%;max-width:546px;height:auto;margin:auto}button{border:0;border-radius:8px;padding:10px 14px;background:#2b674a;color:#fff;font-weight:650;cursor:pointer}label{display:flex;align-items:center;gap:9px;background:#edf4ec;border-radius:8px;padding:13px;margin:12px 0}input{accent-color:#376a50}.muted{font-size:.84rem;color:#64706a}.comparison{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.comparison img{width:100%;border-radius:7px}.comparison div{min-width:0}.comparison span{font-size:.8rem}a{color:#2b6143}</style></head><body><header><div><small>とっておき美術館｜エントランス美術素材</small><h1>赤い絨毯の金の縁取り</h1><p>絨毯の中央はそのまま、外周の金装飾だけを独立させました。</p></div></header><main><section class="card"><h2>金縁の表示・非表示</h2><p class="muted">正式キャラと実際の背景を合わせて検証しています。写真も既存の原本画像のままです。</p><div class="viewer"><canvas id="art" width="1092" height="966"></canvas></div><label><input type="checkbox" id="gold" checked>絨毯の金縁を表示</label><button id="reset">原本の見た目に戻す</button></section><section class="card"><h2>2種類の表示比較</h2><div class="comparison"><div><a href="QA_photos_and_formal_sprites_trim_on.png"><img src="QA_photos_and_formal_sprites_trim_on.png" alt="金縁あり"/></a><span>金縁あり</span></div><div><a href="QA_photos_and_formal_sprites_trim_off.png"><img src="QA_photos_and_formal_sprites_trim_off.png" alt="金縁なし"/></a><span>金縁なし</span></div></div><p class="muted">金縁ありでは、元画像と画素単位で一致します。金縁なしでは、絨毯本体の赤い布目を使って縁取り部分を補っています。</p></section><section class="card"><h2>独立した素材</h2><p><a href="entrance_carpet_gold_trim.png">金縁の透過PNG</a> ／ <a href="QA_manifest.json">座標・透過などのQA</a></p><p class="muted">ゲーム本体への統合は未実施。ユーザーによる美術最終確認待ちの完成候補です。</p></section></main><script src="render-carpet-trim.js"></script></body></html>
