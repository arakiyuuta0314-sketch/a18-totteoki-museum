<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>A18 エントランス｜左右案内板と壁灯</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f6f4ec;color:#25352a;font-family:system-ui,-apple-system,sans-serif}header{background:#28483b;color:white;padding:22px 14px}header div,main{max-width:900px;margin:auto}h1{font-size:1.4rem;margin:4px 0 8px}h2{font-size:1.12rem;margin:7px 0 12px}main{padding:14px}p{line-height:1.7}.block{border:1px solid #e1dfd3;border-radius:14px;background:white;padding:14px;margin-bottom:14px}.canvas{background:#e7e5dc;border-radius:9px;overflow:hidden}canvas{display:block;width:100%;max-width:546px;margin:auto}.toggles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}label{background:#edf4eb;padding:11px;border-radius:9px;display:flex;gap:6px;align-items:center;font-size:.9rem}input{accent-color:#2a6644}button{border:0;border-radius:7px;background:#2e6045;color:#fff;padding:11px;font-weight:bold}a{color:#276344}img{width:100%;border-radius:8px}.small{font-size:.84rem;color:#626a63}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.grid img{width:100%}@media(max-width:380px){.toggles{grid-template-columns:1fr}}</style></head>
<body><header><div><small>とっておき美術館｜エントランス完成美術候補</small><h1>左右の案内板・壁灯</h1>高品質な原本から4点を独立させ、壁面の下地を修復しました。</div></header><main>
<section class="block"><h2>組み合わせを切り替えて確認</h2><p class="small">実際のPNGレイヤーをブラウザで合成しています。背景、写真、正式キャラクターは原本を使用。元のゲームは変更していません。</p><div class="canvas"><canvas id="preview" width="1092" height="966" aria-label="エントランス装飾の4つの切替プレビュー"></canvas></div>
<div class="toggles"><label><input id="west_sign" type="checkbox" checked>左の案内板</label><label><input id="east_sign" type="checkbox" checked>右の案内板</label><label><input id="west_sconce" type="checkbox" checked>左の壁灯</label><label><input id="east_sconce" type="checkbox" checked>右の壁灯</label></div><button id="reset">全表示に戻す</button></section>
<section class="block"><h2>完成美術の比較</h2><div class="grid"><div><a href="QA_photos_sprites_all_four.png"><img alt="4点ありの完成合成" src="QA_photos_sprites_all_four.png"></a><div class="small">すべて表示</div></div><div><a href="QA_photos_sprites_none.png"><img alt="4点を外した壁面下地" src="QA_photos_sprites_none.png"></a><div class="small">すべて非表示</div></div></div>
<p>原本一致の検証: <a href="QA_manifest.json">QAマニフェスト</a></p></section>
<section class="block"><h2>独立PNGの原本品質を確認</h2><div class="grid"><div><img alt="左案内板の原本と透明分離" src="QA_isolation_west_sign.png"></div><div><img alt="右案内板の原本と透明分離" src="QA_isolation_east_sign.png"></div><div><img alt="左壁灯の原本と透明分離" src="QA_isolation_west_sconce.png"></div><div><img alt="右壁灯の原本と透明分離" src="QA_isolation_east_sconce.png"></div></div><p class="small">壁灯の光と金色の縁は原本から抽出。室内の固定構図・北扉・額縁・右手前展示壁は変更していません。ゲーム本体には未統合です。</p></section></main>
<script src="fixture-preview.js"></script></body></html>
