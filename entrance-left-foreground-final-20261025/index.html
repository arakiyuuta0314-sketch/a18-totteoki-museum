t_partition.png"><img src="QA_character_in_front_partition.png" alt="壁の手前"/></a><small>手前にいる状態</small></div></div><p><a href="QA_manifest.json">制作仕様・透過・合成QA</a></p><p class="muted">固定建築物の前景遮蔽専用です。壁自体の自由配置・拡大には対応しません。ゲーム本体は未変更です。</p></section></main><script src="render-left-foreground.js"></script></body></html>
