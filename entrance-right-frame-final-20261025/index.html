<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>A18 右手前の可変額縁と空き枠</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f5ef;color:#233d30;font-family:system-ui,-apple-system,sans-serif}header{background:#294939;color:white;padding:24px 16px}header>div,main{max-width:880px;margin:auto}h1{font-size:1.4rem;margin:7px 0 9px}p{line-height:1.65}main{padding:14px}.card{background:white;padding:14px;border:1px solid #e2ded1;border-radius:14px;margin:0 0 14px}.viewer{background:#ebe7dc;border-radius:10px}canvas{display:block;width:100%;max-width:546px;margin:auto}label{display:flex;align-items:center;gap:8px;padding:12px;border-radius:9px;background:#eff4ed}input{accent-color:#2b6649}.ctrl{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:14px 0}button{border:0;background:#31694c;color:white;padding:10px 13px;border-radius:8px;font-weight:600}input[type=range]{width:100%}.minor{font-size:.84rem;color:#67756d}.examples{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.examples img{width:100%;border-radius:7px;border:1px solid #dcd9ce}.examples figcaption{text-align:center;font-size:.77rem}figure{margin:0}a{color:#286346}</style></head><body><header><div><small>とっておき美術館｜エントランス完成候補</small><h1>右手前の写真展示枠・空き枠</h1><p>原本の金色額縁を壁面から独立させ、写真を入れたり大きさを変えたりできる形にしました。</p></div></header><main>
<section class="card"><h2>実際にサイズ・表示を切り替える</h2><p class="minor">左右奥の写真・正式キャラクター・右展示壁は原本構図のままです。</p><div class="viewer"><canvas id="viewer" width="1092" height="966" aria-label="右手前額縁の可変プレビュー"></canvas></div>
<div class="ctrl"><div><label for="scale">額縁の大きさ：<output id="scaleValue">100%</output></label><input type="range" id="scale" min="90" max="110" value="100"></div><div><label><input type="checkbox" id="photo" checked>写真登録済み</label><label><input type="checkbox" id="show" checked>額縁を表示</label></div></div><button id="reset">標準状態へ戻す</button></section>
<section class="card"><h2>写真入り3サイズの比較</h2><div class="examples"><figure><a href="QA_frame03_photo_090pct.png"><img src="QA_frame03_photo_090pct.png" alt="90%額縁"></a><figcaption>90%</figcaption></figure><figure><a href="QA_frame03_photo_100pct.png"><img src="QA_frame03_photo_100pct.png" alt="100%額縁"></a><figcaption>100%</figcaption></figure><figure><a href="QA_frame03_photo_110pct.png"><img src="QA_frame03_photo_110pct.png" alt="110%額縁"></a><figcaption>110%</figcaption></figure></div>
<p class="minor">台形の角度を維持して全体を拡大・縮小しています。金色の四隅だけを無理に引き伸ばす方式ではありません。</p><p><a href="QA_manifest.json">実素材の座標・透過・品質QAを見る</a></p></section></main><script src="right-frame-preview.js"></script></body></html>
