<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>A18 背面展示枠の写真照明｜完成候補</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f6f0;color:#254032;font-family:system-ui,-apple-system,sans-serif}header{padding:24px 18px;background:#24483a;color:#fff}header>div,main{max-width:850px;margin:auto}h1{font-size:1.4rem;margin:5px 0}p{line-height:1.75}h2{font-size:1.16rem;margin:4px 0 12px}.main{padding:14px}.card{background:white;border:1px solid #e0dcd0;border-radius:14px;padding:14px;margin-bottom:14px}#canvas{width:100%;max-width:546px;display:block;margin:auto;border-radius:9px}.controls{display:flex;flex-wrap:wrap;gap:12px;padding:14px 0}label{display:flex;align-items:center;gap:7px;background:#edf4e9;border-radius:8px;padding:10px 14px;flex:1 1 140px}input{accent-color:#346b4d}button{background:#2c6548;color:white;border:0;border-radius:6px;padding:10px 15px;font-weight:600}.compare{display:grid;grid-template-columns:1fr 1fr;gap:9px}.compare img,.detail img{width:100%;border-radius:6px}.detail{display:grid;grid-template-columns:1fr 1fr;gap:10px}.muted{font-size:.82rem;color:#68756e}a{color:#2e6750}</style></head><body><header><div>とっておき美術館｜美術素材 完成候補<h1>背面の写真展示灯（左右）</h1><p>金色の写真枠の上にある照明器具を、左右それぞれ独立させました。</p></div></header>
<main class="main"><section class="card"><h2>点灯状態を切り替えて確認</h2><p class="muted">左右の写真は実例、キャラは正式PNG。元の展示枠や写真本体は変更していません。</p><canvas id="canvas" width="1092" height="966" aria-label="左右写真展示灯のレイヤー組み替え"></canvas>
<div class="controls"><label><input type="checkbox" id="west" checked>左の展示灯</label><label><input type="checkbox" id="east" checked>右の展示灯</label></div><button id="reset">両方表示に戻す</button></section>
<section class="card"><h2>写真を残した点灯・非表示比較</h2><div class="compare"><div><a href="QA_photos_sprites_both_lights.png"><img alt="両側の灯りあり" src="QA_photos_sprites_both_lights.png"></a><p class="muted">2灯あり</p></div><div><a href="QA_photos_sprites_no_lights.png"><img alt="両側の灯りなし" src="QA_photos_sprites_no_lights.png"></a><p class="muted">2灯なし</p></div></div><p>壁面復元・透過・原本再合成のQA：<a href="QA_manifest.json">検証データ</a></p></section>
<section class="card"><h2>独立した金色の灯り</h2><div class="detail"><img alt="左の抽出素材" src="QA_picture_light_isolation_west.png"><img alt="右の抽出素材" src="QA_picture_light_isolation_east.png"></div><p class="muted">写真入り表示では写真の上端が暗くならないよう、展示灯の発光部分だけを前景として重ねます。ゲーム本体へはまだ組み込んでいません。</p></section></main><script src="light-preview.js"></script></body></html>
