<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A18 現行封鎖素材の位置比較</title><style>body{font-family:system-ui;background:#f1eee7;color:#25493f;margin:12px}.wrap{max-width:546px;margin:auto}button{font-size:16px;padding:10px;margin:3px;border:1px solid #466d60;border-radius:7px;background:white}img{width:100%;image-rendering:pixelated;border:2px solid #7e5d43;box-sizing:border-box}</style><div class="wrap"><h2>現行の封鎖素材を壁側へ移動</h2><p>新しい扉は描かず、現在の封鎖画像をそのまま左右の外壁方向へ移動した比較です。正面扉は変更していません。</p><button onclick="show('original')">現行位置</button><button onclick="show('flush_12')">壁側へ12px</button><button onclick="show('flush_24')">壁側へ24px</button><img id="scene" src="original_existing.png" alt="現行封鎖素材の位置比較"><p>※静的な位置比較。移動判定は変更していません。</p></div><script>function show(s){document.getElementById('scene').src=s+'_existing.png'}</script></html>
