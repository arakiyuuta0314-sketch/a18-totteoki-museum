<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A18 左右扉削除・封鎖置物のみ</title><style>body{font-family:system-ui;background:#f1eee7;color:#25493f;margin:12px}.wrap{max-width:546px;margin:auto}button{font-size:16px;padding:10px;margin:3px;border:1px solid #466d60;border-radius:7px;background:white}img{width:100%;image-rendering:pixelated;border:2px solid #7e5d43;box-sizing:border-box}</style><div class="wrap"><h2>左右扉を削除・封鎖置物だけ残す</h2><p>左右の扉画像は描いていません。既存の縦長の封鎖オブジェクトだけを左右の画面端へ寄せています。正面扉は維持。</p><button onclick="show('without_side_doors')">扉なし・元位置</button><button onclick="show('blockers_12')">壁側12px</button><button onclick="show('blockers_24')">壁側24px</button><button onclick="show('opened')">開放後</button><img id="scene" src="blockers_24_only.png" alt="左右の封鎖置物だけを壁側に寄せた比較"><p>※実際のゲーム背景を使った静的比較。正式ゲームは未変更です。</p></div><script>function show(s){document.getElementById('scene').src=s+'_only.png'}</script></html>
