<body><header><h1>A18 エントランス Lv.6｜一枚絵</h1><p>実際の正式キャラPNGを合成した美術完成像の比較用画像。ゲームには未組み込み。</p></header>
<main><div class="tabs"><button type="button" id="male" aria-pressed="true">男性館長</button><button type="button" id="female" aria-pressed="false">女性館長</button></div>

<script>
